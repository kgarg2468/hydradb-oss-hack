name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Start HydraDB
        run: bash scripts/start-hydradb.sh "$RUNNER_TEMP/hydradb-data" hydradb-ci
      - run: pytest tests/integration -v
      - name: HydraDB logs on failure
        if: failure()
        run: docker logs hydradb-ci | tail -100

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Syntax check static JS
        run: |
          status=0
          while IFS= read -r -d '' file; do
            node --check "$file" || status=1
          done < <(find hindsight_web/static/ -type f -name '*.js' -print0)
          exit "$status"
      - name: No em or en dashes in UI files
        run: |
          if grep -rn -e "$(printf '\342\200\224')" -e "$(printf '\342\200\223')" \
              --include='*.js' --include='*.css' --include='*.html' hindsight_web/static/; then
            exit 1
          fi
      - name: Self-hosted fonts present
        run: |
          for file in \
            hindsight_web/static/fonts/geist-sans-400.woff2 \
            hindsight_web/static/fonts/geist-sans-500.woff2 \
            hindsight_web/static/fonts/geist-sans-600.woff2 \
            hindsight_web/static/fonts/geist-mono-400.woff2 \
            hindsight_web/static/fonts/geist-mono-500.woff2 \
            hindsight_web/static/fonts/geist-mono-600.woff2 \
            hindsight_web/static/fonts/LICENSE; do
            if [ ! -f "$file" ]; then
              echo "Missing required font file: $file"
              exit 1
            fi
          done
